name: Latest blog post workflow
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  update-readme-with-blog:
    name: Update this repo's README with latest blog posts
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Pull in dev.to/medium posts
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          # Para Medium, use: https://medium.com/feed/@seu_usuario
          # Para Dev.to, use: https://dev.to/feed/cirious_foundation
          feed_list: "https://dev.to/feed/cirious_foundation"
          readme_path: ".github/profile/README.md"
