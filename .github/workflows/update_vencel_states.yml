name: Update README cards

on:
  schedule:
    # Roda a cada 12 horas (mantém mais atualizado do que apenas 1x ao dia)
    - cron: "0 */12 * * *"
  workflow_dispatch: # Permite disparo manual pelo botão no GitHub

# 🛡️ OBRIGATÓRIO: Concede permissão para o bot alterar o repositório
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate stats card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate WakaTime card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: wakatime
          options: username=${{ github.repository_owner }}&api_domain=wakatime.com
          path: profile/wakatime.svg
          token: ${{ secrets.WAKATIME_API_KEY }}
          
      - name: Commit and push cards
        run: |
          # Configura a identidade oficial do bot do GitHub
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Adiciona os SVGs gerados
          git add profile/*.svg
          
          # Condicional segura: Só executa o commit se houver alterações reais no SVG
          if ! git diff --staged --quiet; then
            git commit -m "chore(docs): auto-update README stats cards"
            git push
          else
            echo "Nenhuma alteração nas estatísticas. Pulando o commit."
          fi
